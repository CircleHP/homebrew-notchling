name: Bottle

# Homebrew runs its build-from-source checks — among them a Command Line Tools minimum version —
# for any formula it cannot pour (formula_installer.rb:553). This formula compiles nothing on the
# stable path, but without a bottle every install still counts as a source build, so anyone whose
# developer tools are missing or outdated is refused. A bottle is what turns the install into a
# pour, and it is the whole reason this workflow exists.
#
# Run it after publishing a notchling release, with that release's version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to bottle, without the leading v
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  bottle:
    name: build, publish and prove it pours
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # `brew bottle` repackages an installed keg, and refuses one that was not installed with
      # --build-bottle. The fully-qualified name matters too: `brew install` trusts a third-party
      # tap only when named in full (cmd/install.rb:204), and a bare name would be refused.
      - name: Install for bottling
        run: |
          brew tap CircleHP/notchling
          brew install --build-bottle circlehp/notchling/notchling

      - name: Bottle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/CircleHP/homebrew-notchling/releases/download/bottle-$VERSION" \
            circlehp/notchling/notchling
          ls -l ./*.bottle.tar.gz ./*.bottle.json

          # The bundle is a universal Mach-O with a macOS 14 floor and no reference to any Homebrew
          # path, so one bottle serves every macOS and both architectures — which is just as well,
          # since Intel runners to build a second one on are no longer a given. That is only true if
          # Homebrew agrees no relocation is needed; if it ever disagrees, stop rather than ship a
          # bottle that silently breaks on the other prefix.
          cellar=$(jq -r '.[].bottle.cellar' ./*.bottle.json | sed 's/^://')
          echo "cellar: $cellar"
          test "$cellar" = "any_skip_relocation"

          built=$(ls ./*.bottle.tar.gz)
          mv "$built" "notchling--$VERSION.all.bottle.tar.gz"
          echo "BOTTLE_SHA=$(shasum -a 256 "notchling--$VERSION.all.bottle.tar.gz" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Publish the bottle
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "bottle-$VERSION" \
            --title "Bottle $VERSION" \
            --notes "Bottle for notchling $VERSION. Poured by \`brew install circlehp/notchling/notchling\`." \
            "notchling--$VERSION.all.bottle.tar.gz" \
          || gh release upload "bottle-$VERSION" "notchling--$VERSION.all.bottle.tar.gz" --clobber

      - name: Record the bottle in the formula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version, sha = os.environ["VERSION"], os.environ["BOTTLE_SHA"]
          path = pathlib.Path("Formula/notchling.rb")
          source = path.read_text()
          block = (
              '  bottle do\n'
              f'    root_url "https://github.com/CircleHP/homebrew-notchling/releases/download/bottle-{version}"\n'
              f'    sha256 cellar: :any_skip_relocation, all: "{sha}"\n'
              '  end\n'
          )
          source = re.sub(r"  bottle do\n(?:.*\n)*?  end\n", "", source)
          source = source.replace('  license "MIT"\n', '  license "MIT"\n\n' + block, 1)
          path.write_text(source)
          PY
          cat Formula/notchling.rb | head -20

      - name: Commit the formula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "CircleHP"
          git config user.email "evmenovdv@gmail.com"
          git add Formula/notchling.rb
          git commit \
            -m "build: bottle notchling $VERSION" \
            -m "Without a bottle Homebrew treats every install as a source build and refuses when the Command Line Tools are missing or outdated, though this formula compiles nothing."
          git push

      # The point of all of this, asserted rather than assumed: a fresh install must pour rather
      # than build. Anything else means the bottle is not being found or not being accepted.
      - name: Prove it pours
        env:
          VERSION: ${{ inputs.version }}
        run: |
          brew uninstall --force notchling
          git -C "$(brew --repository CircleHP/notchling)" pull --quiet
          brew install circlehp/notchling/notchling 2>&1 | tee install.log
          grep -q "Pouring notchling--$VERSION.all.bottle.tar.gz" install.log
          brew test circlehp/notchling/notchling
